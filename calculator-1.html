<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #11131a;
    font-family: "Segoe UI", system-ui, sans-serif;
    padding: 16px;
  }

  .calculator {
    width: 100%;
    max-width: 360px;
    background: #1b1e29;
    border-radius: 24px;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
  }

  .display {
    background: #0d0f15;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 18px;
    text-align: right;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }

  .expression {
    color: #7c8499;
    font-size: 1rem;
    min-height: 1.4em;
    word-break: break-all;
  }

  .current {
    color: #fff;
    font-size: 2.4rem;
    font-weight: 600;
    word-break: break-all;
    line-height: 1.2;
  }

  .current.error { color: #ff6b6b; font-size: 1.4rem; }

  /* CSS Grid button layout */
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 64px);
    gap: 12px;
  }

  button {
    border: none;
    border-radius: 16px;
    font-size: 1.4rem;
    font-family: inherit;
    cursor: pointer;
    color: #fff;
    background: #2b3042;
    transition: transform 0.08s, filter 0.15s;
  }
  button:hover { filter: brightness(1.2); }
  button:active { transform: scale(0.95); }

  .operator { background: #f59e0b; color: #1b1e29; font-weight: 600; }
  .action   { background: #444b63; }
  .clear    { background: #e5484d; }
  .equals   { background: #22c55e; color: #0d0f15; font-weight: 700; }

  .zero { grid-column: span 2; }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="buttons">
      <button class="clear" data-action="clear">C</button>
      <button class="action" data-action="backspace">⌫</button>
      <button class="operator" data-operator="÷">÷</button>
      <button class="operator" data-operator="×">×</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="−">−</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="+">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="equals" data-action="equals" style="grid-row: span 2;">=</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal">.</button>
    </div>
  </div>

<script>
  const expressionEl = document.getElementById("expression");
  const currentEl = document.getElementById("current");

  let tokens = [];          // e.g. [5, "+", 3, "×"]
  let current = "";         // number currently being typed
  let justEvaluated = false;
  let hasError = false;

  function format(n) {
    // avoid floating point noise like 0.1 + 0.2
    return parseFloat(n.toPrecision(12)).toString();
  }

  function updateDisplay() {
    expressionEl.textContent = tokens.join(" ");
    currentEl.classList.toggle("error", hasError);
    if (!hasError) currentEl.textContent = current === "" ? "0" : current;
  }

  function resetAll() {
    tokens = [];
    current = "";
    justEvaluated = false;
    hasError = false;
  }

  function showError(msg) {
    hasError = true;
    tokens = [];
    current = "";
    currentEl.textContent = msg;
  }

  // Own evaluation logic (no eval): × and ÷ first, then + and −
  function evaluate(list) {
    const pass1 = [list[0]];
    for (let i = 1; i < list.length; i += 2) {
      const op = list[i];
      const right = list[i + 1];
      if (op === "×" || op === "÷") {
        const left = pass1.pop();
        switch (op) {
          case "×":
            pass1.push(left * right);
            break;
          case "÷":
            if (right === 0) throw new Error("Cannot divide by zero");
            pass1.push(left / right);
            break;
        }
      } else {
        pass1.push(op, right);
      }
    }

    let result = pass1[0];
    for (let i = 1; i < pass1.length; i += 2) {
      switch (pass1[i]) {
        case "+": result += pass1[i + 1]; break;
        case "−": result -= pass1[i + 1]; break;
      }
    }
    return result;
  }

  function inputDigit(d) {
    if (hasError || justEvaluated) resetAll();
    if (current === "0") current = d;
    else current += d;
    updateDisplay();
  }

  function inputDecimal() {
    if (hasError || justEvaluated) resetAll();
    if (current.includes(".")) return;
    current = current === "" ? "0." : current + ".";
    updateDisplay();
  }

  function inputOperator(op) {
    if (hasError) return;
    justEvaluated = false; // lets you keep chaining from a result
    if (current === "") {
      if (tokens.length === 0) return;
      // replace the last operator if user taps another one
      tokens[tokens.length - 1] = op;
    } else {
      tokens.push(parseFloat(current), op);
      current = "";
    }
    updateDisplay();
  }

  function equals() {
    if (hasError || justEvaluated) return;
    if (current === "" && tokens.length === 0) return;
    if (current === "") tokens.pop(); // drop trailing operator
    else tokens.push(parseFloat(current));
    if (tokens.length === 0) return;

    const fullExpr = tokens.join(" ");
    try {
      const result = format(evaluate(tokens));
      tokens = [];
      current = result;
      justEvaluated = true;
      updateDisplay();
      expressionEl.textContent = fullExpr + " =";
    } catch (err) {
      showError(err.message);
      expressionEl.textContent = fullExpr + " =";
    }
  }

  function backspace() {
    if (hasError) { resetAll(); updateDisplay(); return; }
    if (justEvaluated) { resetAll(); updateDisplay(); return; }
    if (current !== "") {
      current = current.slice(0, -1);
    } else if (tokens.length > 0) {
      tokens.pop();                       // remove operator
      current = String(tokens.pop() ?? ""); // bring previous number back for editing
    }
    updateDisplay();
  }

  function handleAction(action) {
    switch (action) {
      case "clear":     resetAll(); updateDisplay(); break;
      case "backspace": backspace(); break;
      case "decimal":   inputDecimal(); break;
      case "equals":    equals(); break;
    }
  }

  // Event listeners on every button (no inline onclick)
  document.querySelectorAll("button").forEach((btn) => {
    btn.addEventListener("click", () => {
      if (btn.dataset.digit !== undefined) inputDigit(btn.dataset.digit);
      else if (btn.dataset.operator) inputOperator(btn.dataset.operator);
      else if (btn.dataset.action) handleAction(btn.dataset.action);
    });
  });

  // Bonus: keyboard support
  document.addEventListener("keydown", (e) => {
    if (/^[0-9]$/.test(e.key)) inputDigit(e.key);
    else if (e.key === ".") inputDecimal();
    else if (e.key === "+") inputOperator("+");
    else if (e.key === "-") inputOperator("−");
    else if (e.key === "*") inputOperator("×");
    else if (e.key === "/") { e.preventDefault(); inputOperator("÷"); }
    else if (e.key === "Enter" || e.key === "=") equals();
    else if (e.key === "Backspace") backspace();
    else if (e.key === "Escape") handleAction("clear");
  });

  updateDisplay();
</script>
</body>
</html>
